# Cellpose-SAM task node. Python 3.11; macOS needs 14+ (torch 2.14 wheels).
# Scientific stack via conda-forge; remaining packages via pip.
# Pins match requirements.txt (pip-only install) and
# TissueLab/app/service/requirements-packaging.txt where used.
# tissuelab_sdk 0.1.14 already depends on nibabel and pydicom; cellpose pulls
# fastremap, segment-anything and tqdm.
#   conda env create -f environment.yml
name: cellpose_sam_environment
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.4.6
  # pthreads OpenBLAS: the openmp build loads conda's libomp next to the one
  # bundled in pip torch, and macOS aborts the import (OMP Error #15).
  - libopenblas=*=*pthreads*
  - pillow=12.3.0
  - scipy=1.17.1
  - scikit-image=0.26.0
  # scikit-image pulls tifffile; pinned here so pip keeps conda's copy.
  - tifffile=2026.3.3
  - pandas=3.0.5
  - requests=2.34.2
  - pip:
    # macOS: PyPI CPU/MPS. Linux/Windows: CUDA 12.6 (not PyPI's default CUDA 13).
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.14.0; sys_platform == "darwin"
    - torch==2.14.0+cu126; sys_platform != "darwin"
    - torchvision==0.29.0; sys_platform == "darwin"
    - torchvision==0.29.0+cu126; sys_platform != "darwin"

    # Cellpose 4 is Cellpose-SAM; the node runs its cpsam_v2 model only. Cap
    # below 5 so a future breaking release is not pulled by pip.
    - cellpose>=4.2.1.1,<5

    # Headless only: cellpose depends on it, and a second OpenCV package
    # (pip opencv-python or conda opencv) would clobber the same cv2 module.
    - opencv-python-headless==5.0.0.93
    - zarr==3.1.6
    - tiffslide==3.0.1

    - fastapi==0.141.1
    - uvicorn[standard]==0.52.4
    - pydantic==2.13.5
    - sse-starlette==3.4.6
    - tissuelab_sdk==0.1.14

    # TensorRT path for the SAM encoder (cpsam_trt.py), Linux/Windows with CUDA
    # only; without these the node runs PyTorch. Versions match napa's
    # cellcast_infer env. onnxruntime-gpu 1.27 drops CUDA 12. tensorrt on PyPI
    # is a stub that fetches its wheels from pypi.nvidia.com at install time.
    - onnx==1.23.2; sys_platform != "darwin"
    - onnxruntime-gpu==1.26.0; sys_platform != "darwin"
    - tensorrt==10.9.0.34; sys_platform != "darwin"
