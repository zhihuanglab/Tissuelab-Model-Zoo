name: instanseg
channels:
  - conda-forge
  - pytorch
  - nvidia  # For CUDA support (if using GPU)
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24.0
  - scipy>=1.11.0
  - matplotlib>=3.7.0
  - scikit-image>=0.21.0
  - scikit-learn>=1.3.0
  - pandas>=2.0.0
  - tqdm>=4.64.0
  - requests>=2.31.0
  - pip:
    # PyTorch - install based on your CUDA version
    # For CUDA 11.8:
    # - torch>=2.0.0
    # - torchvision>=0.15.0
    # For CPU-only or CUDA 12.1:
    - torch>=2.0.0
    - torchvision>=0.15.0
    
    # Computer Vision
    - opencv-python>=4.8.0
    
    # Image I/O
    - tiffslide>=1.5.0
    - tifffile>=2023.1.0
    - bioio>=0.4.0  # For bioimageio model support
    - rasterio>=1.3.0  # For geojson export
    
    # Data Storage
    - zarr==3.1.5
    
    # Web Framework
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - sse-starlette>=1.6.5
    
    # Utilities
    - multiprocess>=0.70.17
    - fastremap>=1.1.6
    - geojson>=3.1.0
    - natsort>=8.2.0
    
    # Optional: For advanced features
    # - bioio-bioformats>=0.1.0  # If using bioformats reader
    # - slideio>=0.4.0  # Alternative slide reader

